<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skillora | Sign Up</title>
    <link rel="stylesheet" th:href="@{/images/css/auth.css}"></head>
<body>

<img class="logo" th:src="@{/images/skillora-logo.png}" alt="Skillora">

<div class="auth-card">
    <h1>Sign Up</h1>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <div class="field">
            <input type="text" th:field="*{username}" placeholder="Username">
            <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>
        <div class="field">
            <input type="email" th:field="*{email}" placeholder="Email">
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <div class="field">
            <input type="password" th:field="*{password}" placeholder="Password (min. 8 characters)">
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>
        <button class="btn" type="submit">Create Account</button>
    </form>

    <p class="switch">Already have an account?
        <a th:href="@{/login}">Sign in</a>
    </p>
</div>

</body>
</html>
