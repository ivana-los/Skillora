<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skillora | Sign In</title>
    <link rel="stylesheet" th:href="@{/images/css/auth.css}">
</head>
<body>

<img class="logo" th:src="@{/images/skillora-logo.png}" alt="Skillora">

<div class="auth-card">
    <h1>Sign In</h1>

    <div class="alert alert-error" th:if="${param.error}">
        Incorrect username or password.
    </div>
    <div class="alert alert-success" th:if="${param.logout}">
        You have been signed out.
    </div>
    <div class="alert alert-success" th:if="${param.registered}">
        Registration successful. Please sign in.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <input type="text" name="username" placeholder="Username" required autofocus>
        </div>
        <div class="field">
            <input type="password" name="password" placeholder="Password" required>
        </div>
        <button class="btn" type="submit">Sign In</button>
    </form>

    <p class="switch">New to Skillora?
        <a th:href="@{/register}">Sign up now</a>
    </p>
</div>

</body>
</html>
